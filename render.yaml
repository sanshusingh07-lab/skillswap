services:
  - type: web
    name: skillswap
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString

databases:
  - name: skillswap-db
    databaseName: skillswap
    user: skillswap
    plan: free
