{% extends 'base.html' %}{% block content %}<section class="dashboard"><div class="wrap"><div class="eyebrow">Community directory</div><h1>Users.</h1><div class="table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Joined</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.department }}</td><td>{{ user.created_at.strftime('%Y-%m-%d') }}</td></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
