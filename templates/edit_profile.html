{% extends 'base.html' %}{% block content %}<section class="auth-shell"><div class="auth-panel"><div class="eyebrow">Keep it current</div><h1>Edit your profile.</h1><p>Help the right learning partner find you.</p><form method="post">{{ csrf_token() }}<div class="field"><label for="name">Full name</label><input id="name" name="name" value="{{ profile_user.name }}" required></div><div class="form-grid"><div class="field"><label for="college">College</label><input id="college" name="college" value="{{ profile_user.college }}" required></div><div class="field"><label for="department">Department</label><input id="department" name="department" value="{{ profile_user.department }}" required></div></div><div class="field"><label for="year">Year</label><input id="year" name="year" value="{{ profile_user.year }}"></div><div class="field"><label for="bio">Bio</label><textarea id="bio" name="bio">{{ profile_user.bio }}</textarea></div><button class="button button-primary" type="submit">Save changes</button></form></div></section>{% endblock %}
